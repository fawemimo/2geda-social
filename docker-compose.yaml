#docker-compose.yml
version: '3.8'

services:
  redis:
    image: redis:7.2 
    container_name: redis_server
    restart: unless-stopped  
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly no
      --aof-use-rdb-preamble yes
      --save 300 1000
      --save 60 10000
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --activedefrag yes
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
      --lazyfree-lazy-server-del yes
      --tcp-backlog 1024
      --maxclients 10000
      --loglevel warning
    volumes:
      - redis_data:/data
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    sysctls:
      - net.core.somaxconn=1024
    environment:
      - REDIS_AOF_REWRITE_MIN_SIZE=64mb
      - REDIS_AOF_REWRITE_PERCENT=100
    deploy:
      resources:
        limits:
          memory: 750m

  db:
    image: postgres:17
    restart: always
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5  

  web:
    build: .
    entrypoint: ./entrypoint.sh
    # command: python manage.py runserver 0.0.0.0:8000
    command: gunicorn core.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 2
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    environment:  
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_HOST: ${DB_HOST} 
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/status/"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    build: .
    command: >
      celery -A core.celery worker
      --autoscale=4,1
      --loglevel=info
      --queues=default,high_priority
      --prefetch-multiplier=2
      --max-tasks-per-child=500
      --max-memory-per-child=100000
      -E
    depends_on:
      redis:
        condition: service_healthy
    environment:
        CELERY_BROKER_URL: redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - .:/app
    restart: always

  celery-beat:
    build: .
    command: celery -A core beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - .:/app
    restart: always

volumes:
  redis_data:
    driver: local
  postgres_data:




