[pytest]
DJANGO_SETTINGS_MODULE = core.test_settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
    --reuse-db
    --no-migrations
markers =
    unit: pure-logic test, no I/O
    integration: needs DB / Redis / Celery
    slow: long-running
filterwarnings =
    ignore::DeprecationWarning
