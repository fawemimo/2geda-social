<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>{{ subject|default:"2geda Social" }}</title>
    <style>
        /* Client resets */
        body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
        table { border-collapse: collapse !important; }
        img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
        a { text-decoration: none; }

        /* Content helpers usable from the .txt bodies */
        .mail-h1 { margin: 0 0 16px; font-size: 22px; line-height: 30px; font-weight: 700; color: #101828; }
        .mail-p { margin: 0 0 16px; font-size: 15px; line-height: 24px; color: #475467; }
        .mail-muted { margin: 0; font-size: 13px; line-height: 20px; color: #98a2b3; }
        .mail-code {
            display: inline-block; padding: 14px 28px; border-radius: 10px;
            background: #f2f4f7; border: 1px solid #e4e7ec;
            font-family: "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 30px; line-height: 36px; font-weight: 700;
            letter-spacing: 8px; color: #101828;
        }
        .mail-btn {
            display: inline-block; padding: 13px 28px; border-radius: 8px;
            background: #1570ef; color: #ffffff !important;
            font-size: 15px; line-height: 20px; font-weight: 600;
        }
        .mail-divider { height: 1px; line-height: 1px; background: #e4e7ec; margin: 28px 0; font-size: 0; }

        @media only screen and (max-width: 620px) {
            .mail-container { width: 100% !important; }
            .mail-pad { padding-left: 24px !important; padding-right: 24px !important; }
            .mail-code { font-size: 24px !important; letter-spacing: 6px !important; padding: 12px 20px !important; }
        }

        @media (prefers-color-scheme: dark) {
            .mail-bg { background: #0c111d !important; }
            .mail-card { background: #161b26 !important; border-color: #333741 !important; }
            .mail-h1 { color: #f5f5f6 !important; }
            .mail-p { color: #cecfd2 !important; }
            .mail-muted, .mail-footer-text { color: #94969c !important; }
            .mail-code { background: #0c111d !important; border-color: #333741 !important; color: #f5f5f6 !important; }
            .mail-divider { background: #333741 !important; }
        }
    </style>
</head>
<body class="mail-bg" style="margin:0; padding:0; background:#f2f4f7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

    <!-- Preview text shown in the inbox list, hidden in the body -->
    <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">
        {{ preheader|default:subject|default:"A message from 2geda Social" }}
        &#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="mail-bg" style="background:#f2f4f7;">
        <tr>
            <td align="center" style="padding:32px 12px;">

                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="mail-container" style="width:600px; max-width:600px;">

                    <!-- Header -->
                    <tr>
                        <td align="center" style="padding:0 0 24px;">
                            <a href="{{ site }}" target="_blank" style="font-size:24px; line-height:30px; font-weight:800; color:#1570ef; letter-spacing:-0.5px;">
                                2geda
                            </a>
                        </td>
                    </tr>

                    <!-- Card -->
                    <tr>
                        <td class="mail-card" style="background:#ffffff; border:1px solid #e4e7ec; border-radius:14px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td class="mail-pad" style="padding:40px;">
                                        {{ content }}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding:24px 16px 0;">
                            <p class="mail-footer-text" style="margin:0 0 8px; font-size:12px; line-height:18px; color:#98a2b3;">
                                Sent {{ action_date_time }}
                            </p>
                            <p class="mail-footer-text" style="margin:0 0 8px; font-size:12px; line-height:18px; color:#98a2b3;">
                                You are receiving this email because you have an account on
                                <a href="{{ site }}" target="_blank" style="color:#1570ef;">2geda</a>.
                            </p>
                            <p class="mail-footer-text" style="margin:0; font-size:12px; line-height:18px; color:#98a2b3;">
                                &copy; {% now "Y" %} 2geda Social. All rights reserved.
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
